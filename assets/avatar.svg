<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="80" cy="80" r="76"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c29f"/>
      <stop offset="100%" stop-color="#df9a70"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="80" cy="80" r="78" fill="#e2e8f0" stroke="#3b82f6" stroke-width="3"/>
  
  <g clip-path="url(#circleClip)">
    <rect width="160" height="160" fill="url(#bgGrad)" opacity="0.15"/>
    
    <!-- Clothes / Shirt -->
    <path d="M 20 160 C 20 120 50 115 80 115 C 110 115 140 120 140 160 Z" fill="#1e293b"/>
    <!-- Collar / Inner Shirt -->
    <polygon points="65,115 80,135 95,115 80,122" fill="#3b82f6"/>

    <!-- Neck -->
    <rect x="70" y="90" width="20" height="28" fill="#d98c62"/>

    <!-- Head / Face -->
    <ellipse cx="80" cy="72" rx="26" ry="32" fill="url(#skinGrad)"/>

    <!-- Hair -->
    <path d="M 52 65 C 50 40 65 30 80 30 C 95 30 110 40 108 65 C 104 55 98 48 80 48 C 62 48 56 55 52 65 Z" fill="#18181b"/>
    <path d="M 52 60 C 50 72 53 78 54 82 C 55 80 56 75 56 70 Z" fill="#18181b"/>
    <path d="M 108 60 C 110 72 107 78 106 82 C 105 80 104 75 104 70 Z" fill="#18181b"/>

    <!-- Ears -->
    <ellipse cx="53" cy="74" rx="4" ry="7" fill="#df9a70"/>
    <ellipse cx="107" cy="74" rx="4" ry="7" fill="#df9a70"/>

    <!-- Eyebrows -->
    <path d="M 62 62 Q 70 59 75 62" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 85 62 Q 90 59 98 62" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="69" cy="68" rx="3.5" ry="3" fill="#18181b"/>
    <circle cx="70" cy="67" r="1" fill="#ffffff"/>
    <ellipse cx="91" cy="68" rx="3.5" ry="3" fill="#18181b"/>
    <circle cx="92" cy="67" r="1" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 80 68 L 78 78 L 83 78" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>

    <!-- Smile & Beard -->
    <path d="M 72 85 Q 80 92 88 85" stroke="#18181b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Subtle beard / mustache -->
    <path d="M 72 82 Q 80 84 88 82" stroke="#27272a" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 74 94 Q 80 99 86 94" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
