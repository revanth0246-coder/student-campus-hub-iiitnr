<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c27852"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="340" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="120" cy="50" rx="45" ry="16"/>
    <ellipse cx="150" cy="45" rx="35" ry="20"/>
    <ellipse cx="90" cy="52" rx="30" ry="14"/>
    
    <ellipse cx="480" cy="70" rx="55" ry="18"/>
    <ellipse cx="520" cy="65" rx="40" ry="22"/>
    <ellipse cx="450" cy="74" rx="35" ry="15"/>
  </g>

  <!-- Distant Trees -->
  <g fill="#166534" opacity="0.6">
    <circle cx="50" cy="200" r="45"/>
    <circle cx="95" cy="195" r="40"/>
    <circle cx="520" cy="195" r="45"/>
    <circle cx="560" cy="200" r="40"/>
  </g>

  <!-- Campus Building (Classic Brick Architecture) -->
  <g filter="url(#shadow)">
    <!-- Base Foundation -->
    <rect x="140" y="160" width="320" height="110" fill="#f1f5f9" rx="2"/>
    <rect x="145" y="165" width="310" height="100" fill="url(#brickGrad)"/>

    <!-- Left Wing -->
    <rect x="150" y="140" width="80" height="120" fill="url(#brickGrad)"/>
    <polygon points="145,140 190,105 235,140" fill="url(#roofGrad)"/>

    <!-- Right Wing -->
    <rect x="370" y="140" width="80" height="120" fill="url(#brickGrad)"/>
    <polygon points="365,140 410,105 455,140" fill="url(#roofGrad)"/>

    <!-- Central Grand Hall -->
    <rect x="250" y="125" width="100" height="135" fill="url(#brickGrad)"/>
    <polygon points="240,125 300,80 360,125" fill="url(#roofGrad)"/>

    <!-- Central Clock Tower / Cupola -->
    <rect x="275" y="60" width="50" height="65" fill="#f8fafc"/>
    <polygon points="270,60 300,25 330,60" fill="url(#roofGrad)"/>
    <!-- Clock face -->
    <circle cx="300" cy="85" r="14" fill="#fef08a" stroke="#475569" stroke-width="2"/>
    <line x1="300" y1="85" x2="300" y2="76" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="300" y1="85" x2="307" y2="85" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Dome Spire -->
    <line x1="300" y1="25" x2="300" y2="12" stroke="#475569" stroke-width="3"/>
    <circle cx="300" cy="11" r="3" fill="#eab308"/>

    <!-- Classical Columns -->
    <g fill="#f8fafc">
      <rect x="260" y="180" width="10" height="75" rx="2"/>
      <rect x="285" y="180" width="10" height="75" rx="2"/>
      <rect x="305" y="180" width="10" height="75" rx="2"/>
      <rect x="330" y="180" width="10" height="75" rx="2"/>
      <!-- Architrave / Pediment -->
      <polygon points="250,180 300,150 350,180" fill="#f8fafc"/>
    </g>

    <!-- Main Door Entrance -->
    <path d="M 290 255 L 290 220 A 10 10 0 0 1 310 220 L 310 255 Z" fill="#1e293b"/>
    <path d="M 292 255 L 292 222 A 8 8 0 0 1 308 222 L 308 255 Z" fill="#3b82f6" opacity="0.4"/>

    <!-- Windows Left Wing -->
    <g fill="#f8fafc">
      <rect x="165" y="155" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="195" y="155" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="165" y="195" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="195" y="195" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="165" y="230" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="195" y="230" width="16" height="25" rx="3" fill="#93c5fd"/>
    </g>

    <!-- Windows Right Wing -->
    <g fill="#f8fafc">
      <rect x="385" y="155" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="415" y="155" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="385" y="195" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="415" y="195" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="385" y="230" width="16" height="25" rx="3" fill="#93c5fd"/>
      <rect x="415" y="230" width="16" height="25" rx="3" fill="#93c5fd"/>
    </g>
  </g>

  <!-- Foreground Lawn -->
  <path d="M 0 250 Q 300 240 600 250 L 600 340 L 0 340 Z" fill="url(#lawnGrad)"/>

  <!-- Walkway / Path -->
  <polygon points="280,255 320,255 380,340 220,340" fill="url(#pathGrad)"/>

  <!-- Front Ornamental Trees & Bushes -->
  <!-- Left Tree -->
  <g>
    <rect x="100" y="230" width="12" height="50" fill="#78350f" rx="3"/>
    <circle cx="106" cy="220" r="34" fill="#15803d"/>
    <circle cx="90" cy="205" r="26" fill="#22c55e"/>
    <circle cx="122" cy="210" r="24" fill="#16a34a"/>
  </g>
  <!-- Right Tree -->
  <g>
    <rect x="490" y="230" width="12" height="50" fill="#78350f" rx="3"/>
    <circle cx="496" cy="220" r="34" fill="#15803d"/>
    <circle cx="480" cy="205" r="26" fill="#22c55e"/>
    <circle cx="512" cy="210" r="24" fill="#16a34a"/>
  </g>

  <!-- Small Shrubbery -->
  <ellipse cx="210" cy="255" rx="20" ry="12" fill="#166534"/>
  <ellipse cx="390" cy="255" rx="20" ry="12" fill="#166534"/>
</svg>
